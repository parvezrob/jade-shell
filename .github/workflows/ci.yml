name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      version:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: pipx run ruff check .
      - run: shellcheck install.sh scripts/*.sh tests/*.sh packaging/*.sh packaging/jade bin/jade
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci && npm run lint

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies (GObject, GSettings schemas, the Shell theme compiler)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi gir1.2-gdkpixbuf-2.0 sassc \
            gsettings-desktop-schemas gnome-shell-common libglib2.0-bin
      - run: python3 -m unittest discover -s tests -v

  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: nfpm
        run: |
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz \
            | tar xz -C /usr/local/bin nfpm
      - run: sudo apt-get install -y -qq libglib2.0-bin
      - run: scripts/build-packages.sh
        env:
          JADE_VERSION: ${{ inputs.version }}
      - uses: actions/upload-artifact@v5
        with:
          name: packages
          path: dist/

  install:
    needs: packages
    strategy:
      matrix:
        image: ['registry.fedoraproject.org/fedora:44', 'ubuntu:26.04']
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: packages
          path: /pkg
      - name: Install, set up, restore and remove on a fresh system
        run: bash tests/package-smoke.sh
