name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - id: version
        name: The tag matches jade/__init__.py
        run: |
          version=$(python3 -c 'import jade; print(jade.__version__)')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, code $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    needs: check
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.check.outputs.version }}

  publish:
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5.0.0
        with:
          name: packages
          path: dist
      # VERSION is what `jade update` and every installed copy's daily check
      # read from the latest release: a release without it hides itself.
      - name: The packages match the tag
        run: |
          cd dist
          [ "$(cat VERSION)" = "${GITHUB_REF_NAME#v}" ] || { echo "VERSION says $(cat VERSION), the tag $GITHUB_REF_NAME"; exit 1; }
          for package in jade-shell.rpm jade-shell.deb; do
            grep -q "  $package\$" SHA256SUMS || { echo "SHA256SUMS does not list $package"; exit 1; }
          done
          sha256sum --check --strict SHA256SUMS
      - name: GitHub release with the packages the installer downloads
        run: |
          gh release create "$GITHUB_REF_NAME" dist/jade-shell.rpm dist/jade-shell.deb dist/SHA256SUMS dist/VERSION \
            --title "Jade Shell $GITHUB_REF_NAME" --notes-file - --generate-notes <<'EOF'
          Install with the one command on [jadeshell.app](https://jadeshell.app). Don't download these files by hand.

          EOF
        env:
          GH_TOKEN: ${{ github.token }}
