# Built by scripts/build-packages.sh, which stages build/stage first.
name: jade-shell
arch: all
platform: linux
version: ${JADE_VERSION}
release: 1
section: gnome
priority: optional
maintainer: parvezrob <parvezrob@users.noreply.github.com>
vendor: Jade Shell
homepage: https://github.com/parvezrob/jade-shell
license: GPL-3.0-or-later
description: |
  Omarchy's look and polish, on the GNOME you already run.
  Omarchy's look and polish for GNOME 50: 22 themes that recolor the whole
  desktop and your apps, a Mac-style dock, a redrawn top bar and frosted
  glass. After installing, open a terminal and run: jade setup

contents:
  - src: build/stage/lib/
    dst: /usr/share/jade-shell/
    type: tree
  - src: build/stage/extension/
    dst: /usr/share/gnome-shell/extensions/jade-shell@parvezrob.github.io/
    type: tree
  - src: packaging/jade
    dst: /usr/bin/jade
    file_info:
      mode: 0755
  - src: packaging/jade-shell-settings
    dst: /usr/bin/jade-shell-settings
    file_info:
      mode: 0755
  - src: packaging/app/io.github.parvezrob.JadeShell.desktop
    dst: /usr/share/applications/io.github.parvezrob.JadeShell.desktop
  - src: packaging/app/io.github.parvezrob.JadeShell.svg
    dst: /usr/share/icons/hicolor/scalable/apps/io.github.parvezrob.JadeShell.svg
  - src: packaging/install-update
    dst: /usr/libexec/jade-shell/install-update
    file_info:
      mode: 0755
  - src: packaging/io.github.parvezrob.jade-shell.policy
    dst: /usr/share/polkit-1/actions/io.github.parvezrob.jade-shell.policy
  - src: LICENSE
    dst: /usr/share/licenses/jade-shell/LICENSE
    packager: rpm
  - src: LICENSE
    dst: /usr/share/doc/jade-shell/copyright
    packager: deb
  - src: THIRD_PARTY_LICENSES.md
    dst: /usr/share/doc/jade-shell/THIRD_PARTY_LICENSES.md
  # rpm owns only the folders it is told to: without these, removal leaves
  # them behind, empty (dpkg owns every folder it creates).
  - dst: /usr/libexec/jade-shell
    type: dir
    packager: rpm
  - dst: /usr/share/doc/jade-shell
    type: dir
    packager: rpm
  - dst: /usr/share/licenses/jade-shell
    type: dir
    packager: rpm

scripts:
  postinstall: packaging/postinstall.sh
  preremove: packaging/preremove.sh

# Most of the package is already-compressed icons (a .tar.xz); xz packs the
# rest smaller than the default gzip.
rpm:
  compression: xz
deb:
  compression: xz

overrides:
  rpm:
    # openjade, a documentation tool some developer tools pull in, also has a
    # /usr/bin/jade: saying so up front lets dnf explain, not fail midway.
    conflicts:
      - openjade
    depends:
      - gnome-shell >= 50
      - python3 >= 3.11
      - python3-gobject
      - gdk-pixbuf2
      - sassc
      - jetbrains-mono-fonts
      # The Jade Shell app (jade-shell-settings) and its weather.
      - gjs
      - libadwaita
      - libgweather
    # Copy Text and Read QR Code in the Jade Menu and the screenshot card.
    recommends:
      - tesseract
      - zbar
      - python3-qrcode  # the network panel's Share Wi-Fi
  deb:
    depends:
      - gnome-shell (>= 50)
      - python3 (>= 3.11)
      - python3-gi
      - gir1.2-gdkpixbuf-2.0
      - sassc
      - fonts-jetbrains-mono
      - gjs
      - gir1.2-adw-1
      - gir1.2-gweather-4.0
    recommends:
      - tesseract-ocr
      - zbar-tools
      - python3-qrcode
